apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pet-platform.fullname" . }}-secrets
  labels:
    {{- include "pet-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgres://{{ .Values.externalDatabase.user }}:password@{{ .Values.externalDatabase.host }}:{{ .Values.externalDatabase.port }}/{{ .Values.externalDatabase.name }}?sslmode=require"
  JWT_SECRET: "prod-cluster-vault-signed-jwt-secret-key-32b"
  S3_ACCESS_KEY: "change-in-production-vault"
  S3_SECRET_KEY: "change-in-production-vault"
