apiVersion: v1
kind: Service
metadata:
  name: {{ include "pet-platform.fullname" . }}-api
  labels:
    app.kubernetes.io/component: api
    {{- include "pet-platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: api
    {{- include "pet-platform.selectorLabels" . | nindent 4 }}
