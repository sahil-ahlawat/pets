apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pet-platform.fullname" . }}-config
  labels:
    {{- include "pet-platform.labels" . | nindent 4 }}
data:
  ENV: {{ .Values.global.environment | quote }}
  PORT: {{ .Values.config.port | quote }}
  PUBLIC_BASE_URL: {{ .Values.config.publicBaseUrl | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  S3_REGION: {{ .Values.config.s3Region | quote }}
  ALLOWED_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
  REDIS_ADDR: "{{ .Values.externalRedis.host }}:{{ .Values.externalRedis.port }}"
