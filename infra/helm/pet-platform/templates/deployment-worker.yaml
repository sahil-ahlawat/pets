apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pet-platform.fullname" . }}-worker
  labels:
    app.kubernetes.io/component: worker
    {{- include "pet-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
      {{- include "pet-platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
        {{- include "pet-platform.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: ["/usr/local/bin/pet-worker"]
          envFrom:
            - configMapRef:
                name: {{ include "pet-platform.fullname" . }}-config
            - secretRef:
                name: {{ include "pet-platform.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
