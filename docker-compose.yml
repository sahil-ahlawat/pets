version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: pet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pet_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pet_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: pet-backend-api
    restart: unless-stopped
    environment:
      ENV: development
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/pet_platform?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: dev-super-secret-jwt-key-pet-platform-2026
      PUBLIC_BASE_URL: http://localhost:3000
      ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: pet-backend-worker
    restart: unless-stopped
    environment:
      ENV: development
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/pet_platform?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-scheduler:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: pet-backend-scheduler
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/pet-scheduler"]
    environment:
      ENV: development
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/pet_platform?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: pet-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend-api

volumes:
  postgres_data:
  redis_data:
