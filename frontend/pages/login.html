<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — PetIdentity</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">
  <div id="navbar-container"></div>

  <div class="container container-sm" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="card" style="width: 100%; max-width: 440px;">
      <div style="text-align: center; margin-bottom: 28px;">
        <div style="font-size: 2.2rem; margin-bottom: 8px;">🐾</div>
        <h2>Welcome Back</h2>
        <p style="color: var(--color-text-muted); font-size: 0.95rem; margin-top: 4px;">Sign in to access your pet's digital health & QR records.</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Sign In to PetIdentity</button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--color-text-muted);">
        Don't have an account yet? <a href="/pages/register.html" style="font-weight: 600;">Create Free Account</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
  <script>
    window.auth.requireGuest();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submit-btn');

      try {
        btn.disabled = true;
        btn.innerText = 'Signing In...';
        const res = await window.api.login({ email, password });
        window.auth.saveSession(res);
        window.ui.showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => window.location.href = '/pages/dashboard.html', 500);
      } catch (err) {
        window.ui.showToast(err.message || 'Login failed. Please check credentials.', 'error');
        btn.disabled = false;
        btn.innerText = 'Sign In to PetIdentity';
      }
    });
  </script>
</body>
</html>
