<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Companion — PetIdentity</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">
  <div id="navbar-container"></div>

  <div class="container container-sm" style="flex: 1; padding: 40px 20px;">
    <div style="margin-bottom: 24px;">
      <a href="/pages/dashboard.html" style="font-weight: 600; font-size: 0.9rem;">← Back to Dashboard</a>
      <h2 style="margin-top: 8px;">Register a Companion</h2>
      <p style="color: var(--color-text-muted);">Set up your pet's permanent digital identity and generate their initial QR tag.</p>
    </div>

    <div class="card">
      <form id="create-pet-form">
        <h4 style="margin-bottom: 16px; border-bottom: 1px solid var(--color-border); padding-bottom: 8px;">1. Basic Identity</h4>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label">Pet Name *</label>
            <input type="text" id="name" class="form-control" placeholder="e.g., Bruno" required>
          </div>
          <div class="form-group">
            <label class="form-label">Species *</label>
            <select id="species" class="form-control" required>
              <option value="DOG">Dog (Canine)</option>
              <option value="CAT">Cat (Feline)</option>
              <option value="BIRD">Bird</option>
              <option value="RABBIT">Rabbit</option>
              <option value="HORSE">Horse</option>
              <option value="OTHER">Other</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label">Breed</label>
            <input type="text" id="breed" class="form-control" placeholder="e.g., Golden Retriever">
          </div>
          <div class="form-group">
            <label class="form-label">Gender</label>
            <select id="gender" class="form-control">
              <option value="MALE">Male</option>
              <option value="FEMALE">Female</option>
              <option value="UNKNOWN">Unknown</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Weight (kg)</label>
            <input type="number" step="0.1" id="weightKg" class="form-control" placeholder="e.g., 28.5">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Photo URL</label>
          <input type="url" id="avatarUrl" class="form-control" placeholder="https://images.unsplash.com/photo-...">
        </div>

        <h4 style="margin: 24px 0 16px; border-bottom: 1px solid var(--color-border); padding-bottom: 8px;">2. Health & Identification</h4>
        
        <div class="form-group">
          <label class="form-label">Microchip Number</label>
          <input type="text" id="microchipNumber" class="form-control" placeholder="15-digit ISO microchip (e.g. 985141002938491)">
        </div>

        <div class="form-group">
          <label class="form-label">Critical Allergies / Medical Notes</label>
          <textarea id="allergies" class="form-control" placeholder="e.g., Severe allergy to penicillin. Diabetic requiring insulin injections daily."></textarea>
        </div>

        <h4 style="margin: 24px 0 16px; border-bottom: 1px solid var(--color-border); padding-bottom: 8px;">3. Emergency Contact</h4>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label">Secondary Contact Name</label>
            <input type="text" id="emergencyContactName" class="form-control" placeholder="e.g., Dr. Robert (Family Vet)">
          </div>
          <div class="form-group">
            <label class="form-label">Emergency Phone</label>
            <input type="tel" id="emergencyContactPhone" class="form-control" placeholder="+1 (555) 987-6543">
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 16px;">Save Companion & Generate QR Tag →</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
  <script>
    window.auth.requireAuth();

    document.getElementById('create-pet-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');

      const payload = {
        name: document.getElementById('name').value.trim(),
        species: document.getElementById('species').value,
        breed: document.getElementById('breed').value.trim(),
        gender: document.getElementById('gender').value,
        weightKg: parseFloat(document.getElementById('weightKg').value) || null,
        avatarUrl: document.getElementById('avatarUrl').value.trim(),
        microchipNumber: document.getElementById('microchipNumber').value.trim(),
        allergies: document.getElementById('allergies').value.trim(),
        emergencyContactName: document.getElementById('emergencyContactName').value.trim(),
        emergencyContactPhone: document.getElementById('emergencyContactPhone').value.trim(),
      };

      try {
        btn.disabled = true;
        btn.innerText = 'Creating Identity & QR Tag...';
        const res = await window.api.createPet(payload);
        window.ui.showToast('Pet identity created successfully!', 'success');
        localStorage.setItem('active_pet_id', res.id);
        setTimeout(() => window.location.href = `/pages/pet.html?id=${res.id}`, 600);
      } catch (err) {
        window.ui.showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerText = 'Save Companion & Generate QR Tag →';
      }
    });
  </script>
</body>
</html>
